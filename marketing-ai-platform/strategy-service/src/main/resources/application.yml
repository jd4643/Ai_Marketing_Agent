server:
  port: 8081
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketing_ai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    console: '%d{"yyyy-MM-dd''T''HH:mm:ss.SSSX"} {"level":"%p","service":"strategy-service","requestId":"%X{requestId}","message":"%m"}%n'
openai:
  api-key: ${OPENAI_API_KEY:sk-proj-iZ0PFjrBMBmhdE1KFeHSE0Q9LMTeu9amhkn5}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:20}
