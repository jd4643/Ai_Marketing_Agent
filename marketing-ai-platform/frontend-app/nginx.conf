server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy -> api-gateway container
    location /strategy/  { proxy_pass http://api-gateway:8080; }
    location /creative/  { proxy_pass http://api-gateway:8080; }
    location /analytics/ { proxy_pass http://api-gateway:8080; }
    location /generate/  { proxy_pass http://api-gateway:8080; }
    location /trends/    { proxy_pass http://api-gateway:8080; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
