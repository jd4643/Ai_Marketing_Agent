server:
  port: 8083
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_marketing_db}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    console: '%d{"yyyy-MM-dd''T''HH:mm:ss.SSSX"} {"level":"%p","service":"analytics-service","requestId":"%X{requestId}","message":"%m"}%n'
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:15}
