server:
  port: 8083
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketing_ai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    console: '%d{"yyyy-MM-dd''T''HH:mm:ss.SSSX"} {"level":"%p","service":"analytics-service","requestId":"%X{requestId}","message":"%m"}%n'
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:15}
creative:
  winner:
    min-impressions: ${CREATIVE_WINNER_MIN_IMPRESSIONS:3000}
    min-clicks: ${CREATIVE_WINNER_MIN_CLICKS:100}
    min-conversions: ${CREATIVE_WINNER_MIN_CONVERSIONS:3}
    min-roas: ${CREATIVE_WINNER_MIN_ROAS:2.0}
  weak:
    max-roas: ${CREATIVE_WEAK_MAX_ROAS:0.8}
