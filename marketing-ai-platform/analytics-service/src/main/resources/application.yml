server:
  port: 8083
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketing_ai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    console: '%d{"yyyy-MM-dd''T''HH:mm:ss.SSSX"} {"level":"%p","service":"analytics-service","requestId":"%X{requestId}","message":"%m"}%n'
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:15}
creative:
  winner:
    min-impressions: ${CREATIVE_WINNER_MIN_IMPRESSIONS:3000}
    min-clicks: ${CREATIVE_WINNER_MIN_CLICKS:100}
    min-conversions: ${CREATIVE_WINNER_MIN_CONVERSIONS:3}
    min-roas: ${CREATIVE_WINNER_MIN_ROAS:2.0}
  weak:
    max-roas: ${CREATIVE_WEAK_MAX_ROAS:0.8}
  min-confidence: ${CREATIVE_MIN_CONFIDENCE:0.60}
  scoring:
    weight-ctr: ${CREATIVE_SCORING_WEIGHT_CTR:0.25}
    weight-roas: ${CREATIVE_SCORING_WEIGHT_ROAS:0.35}
    weight-conversions: ${CREATIVE_SCORING_WEIGHT_CONVERSIONS:0.25}
    weight-cpa-penalty: ${CREATIVE_SCORING_WEIGHT_CPA_PENALTY:0.15}
meta:
  api:
    base-url: ${META_API_BASE_URL:https://graph.facebook.com}
    version: ${META_API_VERSION:v21.0}
    timeout-seconds: ${META_API_TIMEOUT_SECONDS:30}
  sync:
    lookback-days: ${META_SYNC_LOOKBACK_DAYS:30}
    interval-ms: ${META_SYNC_INTERVAL_MS:3600000}
    initial-delay-ms: ${META_SYNC_INITIAL_DELAY_MS:60000}
platform:
  token:
    encryption-key: ${PLATFORM_TOKEN_ENCRYPTION_KEY:}
