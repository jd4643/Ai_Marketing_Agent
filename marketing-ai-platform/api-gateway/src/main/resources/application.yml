server:
  port: 8080
spring:
  application:
    name: api-gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
gateway:
  rate-limit-per-minute: ${GATEWAY_RATE_LIMIT_PER_MINUTE:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-Id}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}
logging:
  pattern:
    console: '%d{"yyyy-MM-dd''T''HH:mm:ss.SSSX"} {"level":"%p","service":"api-gateway","requestId":"%X{requestId}","message":"%m"}%n'
